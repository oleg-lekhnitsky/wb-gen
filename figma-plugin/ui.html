<!doctype html><html><body style="font:13px system-ui;padding:16px"><h3>Import Resizer banners</h3><p>Choose a slide or pack JSON exported from Resizer.</p><input type="file" accept=".json,application/json" id="file"><pre id="status" style="white-space:pre-wrap"></pre><script>
let source, queue=[], results=[];
const status=document.querySelector('#status');
function importNext(){source=queue.shift();parent.postMessage({pluginMessage:{type:'import',data:source,batchStart:results.length===0,batchEnd:queue.length===0}},'*');status.textContent=`Importing banner ${results.length+1}…`}
document.querySelector('#file').onchange=async event=>{try{
 const data=JSON.parse(await event.target.files[0].text());
 queue=data.type==='pack'?data.banners:[data];results=[];
 if(!Array.isArray(queue)||!queue.length)throw new Error('The export contains no banners.');
 document.querySelector('#file').disabled=true;importNext();
}catch(e){status.textContent=e.message;document.querySelector('#file').disabled=false}};
async function pixels(src){const img=new Image();img.src=src;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);return {width:c.width,height:c.height,data:ctx.getImageData(0,0,c.width,c.height).data}}
onmessage=async event=>{const m=event.data.pluginMessage;if(!m)return;if(m.error){status.textContent=m.error;document.querySelector('#file').disabled=false;return}try{
 const result=m.result;
 if(!source.referencePng){result.comparison='Missing browser reference; visual validation incomplete.'}
 else {
  const url=URL.createObjectURL(new Blob([new Uint8Array(m.png)],{type:'image/png'}));
  try{const a=await pixels(source.referencePng),b=await pixels(url);
   if(a.width!==b.width||a.height!==b.height)throw new Error('Export dimensions differ from browser reference.');
   let total=0,changed=0;for(let i=0;i<a.data.length;i+=4){let max=0;for(let c=0;c<4;c++){const d=Math.abs(a.data[i+c]-b.data[i+c]);total+=d;max=Math.max(max,d)}if(max>16)changed++}
   const mean=total/a.data.length,fraction=changed/(a.width*a.height);
   result.comparison={meanChannelError:mean,changedPixelFraction:fraction,passed:mean<=1&&fraction<=.005};
   result.status=result.warnings.length||!result.comparison.passed?'needs-review':'comparison-passed';
  }finally{URL.revokeObjectURL(url)}
 }
 results.push({name:source.name,...result});
 if(queue.length){importNext();return}
 status.textContent=JSON.stringify(results.length===1?results[0]:{banners:results},null,2);
 document.querySelector('#file').disabled=false;
}catch(e){status.textContent='Visual comparison failed: '+e.message;document.querySelector('#file').disabled=false}};
</script></body></html>
